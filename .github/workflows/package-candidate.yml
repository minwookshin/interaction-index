name: Package candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version, for example 0.1.0-rc.1
        required: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - name: Verify requested version and publication lock
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: node -e "const pkg = JSON.parse(require('fs').readFileSync('package.json')); if (pkg.version !== process.env.EXPECTED_VERSION || pkg.private !== true) process.exit(1)"
      - run: npm run build:registry
      - run: npm run test:registry
      - run: npm run build:package
      - run: npm run check:package
      - run: npm run test:package
      - run: npm run test:dogfood
      - run: npm audit --audit-level=high
      - run: mkdir -p package-candidate
      - run: npm pack --pack-destination package-candidate
      - run: npm sbom --sbom-format cyclonedx > package-candidate/sbom.cdx.json
      - name: Attest package tarball
        uses: actions/attest@v4
        with:
          subject-path: package-candidate/*.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: interaction-index-package-${{ inputs.version }}
          path: package-candidate
          if-no-files-found: error

  publication-remains-manual:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - run: echo "Candidate verified and attested. This workflow does not publish to npm or create a release."
