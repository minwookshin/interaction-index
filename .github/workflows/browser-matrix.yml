name: Browser matrix

on:
  pull_request:
  workflow_dispatch:
    inputs:
      update_baselines:
        description: Generate strict Linux visual baselines for review
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: mobile-chromium
            browser: chromium
          - project: mobile-webkit
            browser: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.update_baselines || matrix.project == 'chromium' }}
        with:
          node-version: 22.14.0
          cache: npm
      - if: ${{ github.event_name != 'workflow_dispatch' || !inputs.update_baselines || matrix.project == 'chromium' }}
        run: npm ci
      - if: ${{ github.event_name != 'workflow_dispatch' || !inputs.update_baselines || matrix.project == 'chromium' }}
        run: npx --no-install playwright install --with-deps ${{ matrix.browser }}
      - if: ${{ github.event_name != 'workflow_dispatch' || !inputs.update_baselines }}
        run: npm run test:browsers -- --project=${{ matrix.project }}
      - name: Generate Linux visual baselines
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baselines && matrix.project == 'chromium' }}
        run: |
          npm run test:stories:visual:update
          npm run test:visual:catalog:update
          npx playwright test tests/browser/visual-regression.spec.ts --project=chromium --update-snapshots
          set -euo pipefail
          find \
            tests/storybook/visual-regression.spec.ts-snapshots \
            tests/storybook/analytics-visual.spec.ts-snapshots \
            tests/storybook/product-patterns-visual.spec.ts-snapshots \
            tests/browser/full-catalog-visual.spec.ts-snapshots \
            tests/browser/visual-regression.spec.ts-snapshots \
            -type f -name '*-linux.png' -print0 \
            | tar --null --files-from=- -czf whatiuse-linux-visual-baselines.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baselines && matrix.project == 'chromium' }}
        with:
          name: whatiuse-linux-visual-baselines
          path: whatiuse-linux-visual-baselines.tar.gz
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-${{ matrix.project }}
          path: |
            playwright-report
            test-results
