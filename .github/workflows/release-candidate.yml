name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version, for example 0.1.0-rc.1
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:rc:core
      - name: Verify requested version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: node -e "const actual = JSON.parse(require('fs').readFileSync('package.json')).version; if (actual !== process.env.EXPECTED_VERSION) { console.error(actual); process.exit(1); }"
      - uses: actions/upload-artifact@v7
        with:
          name: teum-${{ inputs.version }}
          path: |
            dist
            public/r
            performance-report.json
            RELEASE_QA.md
            RC_EXTERNAL_GATES.md
          if-no-files-found: error

  publication-remains-manual:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - run: echo "Verification passed. Tagging, GitHub Release creation, and package publication remain explicit maintainer actions."
